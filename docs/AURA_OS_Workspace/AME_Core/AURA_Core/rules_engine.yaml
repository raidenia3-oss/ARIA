---
# rules_engine.yaml - Motor de Reglas para AURA
# Este archivo define las reglas de acción que se ejecutarán en respuesta a eventos detectados
# en el ecosistema AURA. Las reglas siguen el formato:
#
# SI [condición] -> ENTONCES [acción]
#
# Las condiciones pueden ser combinadas con AND/OR y los eventos pueden ser filtrados
# por tipo, ubicación, severidad, etc.

version: "1.0"
description: "Motor de Reglas para AURA - Sistema de Respuesta Automática a Eventos"
last_updated: "2026-06-02T00:00:00Z"
enabled: true
debug_mode: false
validation_required: true
gatekeeper_validation: true
priority_rules: ["critical", "high", "medium", "low"]

# Configuración global del motor de reglas
global_settings:
  default_timeout: 300  # Tiempo de espera por defecto para acciones (segundos)
  max_concurrent_actions: 5
  retry_attempts: 3
  retry_delay: 60  # Segundos entre reintentos
  action_logging: true
  action_audit: true
  allowed_modules:
    - "osint_venice"
    - "network_scan"
    - "security_audit"
    - "data_exfiltration_check"
    - "device_quarantine"
    - "alert_notification"
    - "threat_intelligence_update"
    - "automated_response"
    - "log_analysis"
    - "behavioral_analysis"
  restricted_modules:
    - "system_reboot"
    - "firewall_modification"
    - "data_wipe"
  module_whitelist: []  # Si está vacío, se usan los allowed_modules
  module_blacklist: []   # Si está vacío, no hay módulos bloqueados

# Definición de eventos soportados
event_types:
  - "device_new"
  - "device_disappeared"
  - "device_changed"
  - "network_scan_complete"
  - "osint_scan_complete"
  - "threat_detected"
  - "anomaly_detected"
  - "device_relationship_created"
  - "data_exfiltration_attempt"
  - "configuration_vulnerability"
  - "unauthorized_access_attempt"
  - "malware_detected"
  - "high_risk_device"
  - "rogue_device"
  - "system_alert"
  - "custom_event"

# Definición de acciones soportadas
action_types:
  - "run_module"
  - "dispatch_task"
  - "send_alert"
  - "update_threat_intel"
  - "quarantine_device"
  - "block_network_access"
  - "log_event"
  - "notify_team"
  - "execute_script"
  - "run_analysis"
  - "update_database"
  - "trigger_workflow"

# Reglas de seguridad y validación
security_rules:
  - rule_id: "rule_security_001"
    name: "Validación de Gatekeeper para todas las acciones"
    description: "Todas las acciones deben ser validadas por el Gatekeeper antes de ejecutarse"
    condition: "event.type == '*'"
    actions:
      - type: "validate_gatekeeper"
        module: "gatekeeper_validation"
        parameters:
          action_type: "{{event.action_type}}"
          target: "{{event.target}}"
          severity: "{{event.severity}}"
          source: "{{event.source}}"
    priority: "high"
    enabled: true

  - rule_id: "rule_security_002"
    name: "Bloqueo de acciones no autorizadas"
    description: "Bloquear acciones que no estén en la lista de módulos permitidos"
    condition: "event.action_type not in allowed_modules and event.action_type not in restricted_modules"
    actions:
      - type: "log_event"
        module: "security_audit"
        parameters:
          message: "Acción no autorizada detectada: {{event.action_type}}"
          severity: "critical"
          source: "rules_engine"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com"]
          subject: "[ALERTA] Acción no autorizada detectada"
          message: "Se intentó ejecutar una acción no autorizada: {{event.action_type}}"
          severity: "critical"
    priority: "critical"
    enabled: true

# Reglas de respuesta a dispositivos nuevos
device_new_rules:
  - rule_id: "rule_device_new_001"
    name: "Dispositivo nuevo detectado - Análisis básico"
    description: "Ejecutar análisis básico cuando se detecta un nuevo dispositivo en la red"
    condition: |
      event.type == "device_new" and
      event.device.vendor != "Unknown" and
      event.device.risk_score < 50
    actions:
      - type: "run_module"
        module: "device_analysis"
        parameters:
          device_mac: "{{event.device.mac}}"
          device_ip: "{{event.device.ip}}"
          analysis_type: "basic"
          timeout: 120
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Análisis básico iniciado para dispositivo nuevo: {{event.device.mac}}"
          device_mac: "{{event.device.mac}}"
          severity: "medium"
    priority: "medium"
    enabled: true

  - rule_id: "rule_device_new_002"
    name: "Dispositivo nuevo con vendor desconocido - Acción inmediata"
    description: "Ejecutar acciones inmediatas cuando se detecta un dispositivo con vendor desconocido"
    condition: |
      event.type == "device_new" and
      event.device.vendor == "Unknown" and
      event.network.name in ["red_corporativa", "red_critica"]
    actions:
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Vendor desconocido"
          severity: "high"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "threat_intel@aura-system.com"]
          subject: "[ALERTA] Dispositivo nuevo con vendor desconocido detectado"
          message: |
            Dispositivo nuevo detectado con MAC {{event.device.mac}} e IP {{event.device.ip}}.
            Vendor: {{event.device.vendor}} (desconocido).
            Ubicación: {{event.network.name}}.
            Acción: Cuarentena iniciada.
          severity: "high"
      - type: "run_module"
        module: "osint_venice"
        parameters:
          target: "{{event.device.ip}}"
          module_name: "deep_osint_scan"
          timeout: 600
          priority: "high"
    priority: "high"
    enabled: true

  - rule_id: "rule_device_new_003"
    name: "Dispositivo nuevo en red crítica - Escaneo OSINT avanzado"
    description: "Ejecutar escaneo OSINT avanzado para dispositivos nuevos en redes críticas"
    condition: |
      event.type == "device_new" and
      event.network.name == "red_critica" and
      event.device.risk_score >= 30
    actions:
      - type: "dispatch_task"
        module: "swarm_manager"
        parameters:
          task_type: "OSINT_SCAN"
          task_parameters:
            target: "{{event.device.ip}}"
            tools: ["PhantomOSINT", "SubdomainEnumeration", "DeepWebAnalysis"]
            depth: 3
            timeout: 1800
          priority: "high"
      - type: "update_threat_intel"
        module: "threat_intelligence"
        parameters:
          device_mac: "{{event.device.mac}}"
          device_ip: "{{event.device.ip}}"
          threat_type: "potential_rogue_device"
          severity: "medium"
          description: "Dispositivo nuevo detectado en red crítica"
    priority: "high"
    enabled: true

# Reglas de respuesta a dispositivos desaparecidos
device_disappeared_rules:
  - rule_id: "rule_device_disappeared_001"
    name: "Dispositivo desaparecido - Verificación de seguridad"
    description: "Verificar si la desaparición de un dispositivo podría indicar una amenaza"
    condition: |
      event.type == "device_disappeared" and
      event.device.risk_score >= 40
    actions:
      - type: "run_module"
        module: "security_audit"
        parameters:
          device_mac: "{{event.device.mac}}"
          audit_type: "device_disappearance"
          timeout: 180
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Dispositivo desaparecido detectado: {{event.device.mac}}"
          device_mac: "{{event.device.mac}}"
          severity: "medium"
    priority: "medium"
    enabled: true

  - rule_id: "rule_device_disappeared_002"
    name: "Dispositivo crítico desaparecido - Alerta inmediata"
    description: "Generar alerta inmediata cuando desaparece un dispositivo crítico"
    condition: |
      event.type == "device_disappeared" and
      event.device.threat_level in ["high", "critical"]
    actions:
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA CRÍTICA] Dispositivo crítico desaparecido"
          message: |
            Dispositivo crítico desaparecido detectado:
            MAC: {{event.device.mac}}
            IP: {{event.device.ip}}
            Último avistamiento: {{event.device.last_seen}}
            Nivel de amenaza: {{event.device.threat_level}}
            Acción recomendada: Investigar posible robo o compromiso.
          severity: "critical"
      - type: "update_threat_intel"
        module: "threat_intelligence"
        parameters:
          device_mac: "{{event.device.mac}}"
          threat_type: "device_tampering"
          severity: "high"
          description: "Dispositivo crítico desaparecido - posible robo o compromiso"
    priority: "critical"
    enabled: true

# Reglas de respuesta a cambios en dispositivos
device_changed_rules:
  - rule_id: "rule_device_changed_001"
    name: "Cambio de IP en dispositivo - Verificación de actividad sospechosa"
    description: "Verificar si cambios de IP podrían indicar actividad sospechosa"
    condition: |
      event.type == "device_changed" and
      event.change_type == "ip_change" and
      event.device.ip_changes > 3
    actions:
      - type: "run_module"
        module: "behavioral_analysis"
        parameters:
          device_mac: "{{event.device.mac}}"
          analysis_type: "ip_change_analysis"
          timeout: 120
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Cambio de IP detectado en dispositivo {{event.device.mac}} (cambio #{{event.device.ip_changes}})"
          device_mac: "{{event.device.mac}}"
          severity: "medium"
    priority: "medium"
    enabled: true

  - rule_id: "rule_device_changed_002"
    name: "Cambio de vendor en dispositivo - Análisis de seguridad"
    description: "Analizar cambios en la información del vendor del dispositivo"
    condition: |
      event.type == "device_changed" and
      event.change_type == "vendor_change" and
      event.device.vendor == "Unknown"
    actions:
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Cambio de vendor a desconocido"
          severity: "high"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com"]
          subject: "[ALERTA] Cambio de vendor a desconocido en dispositivo"
          message: |
            Cambio de vendor detectado en dispositivo {{event.device.mac}}:
            Nuevo vendor: {{event.device.vendor}}
            Cambios previos: {{event.device.vendor_changes}}
            Acción: Cuarentena iniciada.
          severity: "high"
    priority: "high"
    enabled: true

# Reglas de respuesta a amenazas detectadas
threat_detection_rules:
  - rule_id: "rule_threat_001"
    name: "Amenaza detectada - Actualización de inteligencia"
    description: "Actualizar la base de datos de inteligencia de amenazas cuando se detecta una amenaza"
    condition: |
      event.type == "threat_detected" and
      event.threat.severity in ["high", "critical"]
    actions:
      - type: "update_threat_intel"
        module: "threat_intelligence"
        parameters:
          threat_id: "{{event.threat.id}}"
          threat_type: "{{event.threat.type}}"
          severity: "{{event.threat.severity}}"
          description: "{{event.threat.description}}"
          indicators: "{{event.threat.indicators}}"
          related_devices: ["{{event.device.mac}}"]
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Amenaza detectada: {{event.threat.type}} (severidad: {{event.threat.severity}})"
          threat_id: "{{event.threat.id}}"
          severity: "{{event.threat.severity}}"
    priority: "high"
    enabled: true

  - rule_id: "rule_threat_002"
    name: "Amenaza crítica detectada - Respuesta inmediata"
    description: "Ejecutar respuesta inmediata para amenazas críticas"
    condition: |
      event.type == "threat_detected" and
      event.threat.severity == "critical"
    actions:
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA CRÍTICA] {{event.threat.type}} detectada"
          message: |
            Amenaza crítica detectada:
            Tipo: {{event.threat.type}}
            Severidad: {{event.threat.severity}}
            Descripción: {{event.threat.description}}
            Dispositivo afectado: {{event.device.mac}}
            Acción recomendada: Respuesta inmediata requerida.
          severity: "critical"
      - type: "run_module"
        module: "automated_response"
        parameters:
          threat_type: "{{event.threat.type}}"
          device_mac: "{{event.device.mac}}"
          response_level: "critical"
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "{{event.threat.description}}"
          severity: "critical"
    priority: "critical"
    enabled: true

# Reglas de respuesta a intentos de exfiltración de datos
data_exfiltration_rules:
  - rule_id: "rule_exfiltration_001"
    name: "Intento de exfiltración de datos detectado - Bloqueo inmediato"
    description: "Bloquear el dispositivo y notificar al equipo de seguridad cuando se detecta exfiltración"
    condition: |
      event.type == "data_exfiltration_attempt" and
      event.data_transfer.size > 1000  # Más de 1MB
    actions:
      - type: "block_network_access"
        module: "network_control"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Intento de exfiltración de datos detectado"
          severity: "critical"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA CRÍTICA] Intento de exfiltración de datos detectado"
          message: |
            Intento de exfiltración de datos detectado desde dispositivo {{event.device.mac}}:
            Tamaño del transferencia: {{event.data_transfer.size}} MB
            Destino: {{event.data_transfer.destination}}
            Hora: {{event.timestamp}}
            Acción: Acceso a la red bloqueado.
          severity: "critical"
      - type: "update_threat_intel"
        module: "threat_intelligence"
        parameters:
          threat_type: "data_exfiltration"
          severity: "critical"
          description: "Intento de exfiltración de datos desde {{event.device.mac}}"
          indicators: ["{{event.device.mac}}", "{{event.data_transfer.destination}}"]
          related_devices: ["{{event.device.mac}}"]
    priority: "critical"
    enabled: true

  - rule_id: "rule_exfiltration_002"
    name: "Exfiltración de datos sospechosa - Análisis forense"
    description: "Iniciar análisis forense cuando se detecta actividad sospechosa de exfiltración"
    condition: |
      event.type == "data_exfiltration_attempt" and
      event.data_transfer.size <= 1000 and
      event.data_transfer.destination in ["suspicious_domains"]
    actions:
      - type: "run_module"
        module: "forensic_analysis"
        parameters:
          device_mac: "{{event.device.mac}}"
          analysis_type: "data_exfiltration"
          timeout: 1800
          priority: "high"
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Análisis forense iniciado para posible exfiltración desde {{event.device.mac}}"
          device_mac: "{{event.device.mac}}"
          severity: "high"
    priority: "high"
    enabled: true

# Reglas de respuesta a relaciones entre dispositivos
device_relationship_rules:
  - rule_id: "rule_relationship_001"
    name: "Relación sospechosa entre dispositivos - Análisis de comunicación"
    description: "Analizar comunicación entre dispositivos cuando se detecta una relación sospechosa"
    condition: |
      event.type == "device_relationship_created" and
      event.relationship.type in ["potential_communication", "shared_behavior"] and
      event.relationship.strength > 0.7
    actions:
      - type: "run_module"
        module: "network_analysis"
        parameters:
          device1_mac: "{{event.device1.mac}}"
          device2_mac: "{{event.device2.mac}}"
          analysis_type: "communication_pattern"
          timeout: 300
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Relación sospechosa detectada entre {{event.device1.mac}} y {{event.device2.mac}} (fuerza: {{event.relationship.strength}})"
          device1_mac: "{{event.device1.mac}}"
          device2_mac: "{{event.device2.mac}}"
          severity: "medium"
    priority: "medium"
    enabled: true

  - rule_id: "rule_relationship_002"
    name: "Relación de duplicado potencial - Verificación de dispositivos"
    description: "Verificar si dispositivos relacionados podrían ser el mismo dispositivo con MACs diferentes"
    condition: |
      event.type == "device_relationship_created" and
      event.relationship.type == "potential_duplicate" and
      event.relationship.strength > 0.85
    actions:
      - type: "run_module"
        module: "device_verification"
        parameters:
          device1_mac: "{{event.device1.mac}}"
          device2_mac: "{{event.device2.mac}}"
          verification_type: "mac_duplicate_check"
          timeout: 180
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com"]
          subject: "[ALERTA] Posible duplicado de dispositivo detectado"
          message: |
            Posible duplicado de dispositivo detectado:
            Dispositivo 1: {{event.device1.mac}} ({{event.device1.vendor}})
            Dispositivo 2: {{event.device2.mac}} ({{event.device2.vendor}})
            Fuerza de relación: {{event.relationship.strength}}
            Acción: Verificación en curso.
          severity: "medium"
    priority: "medium"
    enabled: true

# Reglas de respuesta a vulnerabilidades de configuración
configuration_vulnerability_rules:
  - rule_id: "rule_vulnerability_001"
    name: "Vulnerabilidad de configuración detectada - Corrección automática"
    description: "Corregir vulnerabilidades de configuración cuando sean detectadas"
    condition: |
      event.type == "configuration_vulnerability" and
      event.vulnerability.severity in ["medium", "high"]
    actions:
      - type: "run_module"
        module: "configuration_fix"
        parameters:
          device_mac: "{{event.device.mac}}"
          vulnerability_type: "{{event.vulnerability.type}}"
          fix_parameters: "{{event.vulnerability.fix_parameters}}"
          timeout: 300
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Corrección de vulnerabilidad iniciada para {{event.device.mac}}: {{event.vulnerability.type}}"
          device_mac: "{{event.device.mac}}"
          severity: "{{event.vulnerability.severity}}"
    priority: "medium"
    enabled: true

  - rule_id: "rule_vulnerability_002"
    name: "Vulnerabilidad crítica detectada - Alerta inmediata"
    description: "Generar alerta inmediata para vulnerabilidades críticas"
    condition: |
      event.type == "configuration_vulnerability" and
      event.vulnerability.severity == "critical"
    actions:
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "admin_network@aura-system.com"]
          subject: "[ALERTA CRÍTICA] Vulnerabilidad crítica detectada en {{event.device.mac}}"
          message: |
            Vulnerabilidad crítica detectada:
            Tipo: {{event.vulnerability.type}}
            Severidad: {{event.vulnerability.severity}}
            Descripción: {{event.vulnerability.description}}
            Dispositivo afectado: {{event.device.mac}}
            Acción recomendada: Corrección inmediata requerida.
          severity: "critical"
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Vulnerabilidad crítica detectada: {{event.vulnerability.type}}"
          severity: "critical"
    priority: "critical"
    enabled: true

# Reglas de respuesta a intentos de acceso no autorizado
unauthorized_access_rules:
  - rule_id: "rule_unauthorized_001"
    name: "Intento de acceso no autorizado detectado - Bloqueo inmediato"
    description: "Bloquear el dispositivo y notificar al equipo de seguridad cuando se detecta acceso no autorizado"
    condition: |
      event.type == "unauthorized_access_attempt" and
      event.attempt.success == false
    actions:
      - type: "block_network_access"
        module: "network_control"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Intento de acceso no autorizado detectado"
          severity: "high"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA] Intento de acceso no autorizado desde {{event.device.mac}}"
          message: |
            Intento de acceso no autorizado detectado:
            Dispositivo: {{event.device.mac}}
            IP: {{event.device.ip}}
            Usuario: {{event.attempt.username}}
            Éxito: {{event.attempt.success}}
            Método: {{event.attempt.method}}
            Acción: Acceso a la red bloqueado.
          severity: "high"
      - type: "update_threat_intel"
        module: "threat_intelligence"
        parameters:
          threat_type: "unauthorized_access_attempt"
          severity: "high"
          description: "Intento de acceso no autorizado desde {{event.device.mac}}"
          indicators: ["{{event.device.mac}}", "{{event.device.ip}}", "{{event.attempt.username}}"]
          related_devices: ["{{event.device.mac}}"]
    priority: "high"
    enabled: true

  - rule_id: "rule_unauthorized_002"
    name: "Acceso no autorizado exitoso - Respuesta crítica"
    description: "Ejecutar respuesta crítica cuando se detecta acceso no autorizado exitoso"
    condition: |
      event.type == "unauthorized_access_attempt" and
      event.attempt.success == true
    actions:
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Acceso no autorizado exitoso detectado"
          severity: "critical"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com", "admin_network@aura-system.com"]
          subject: "[ALERTA CRÍTICA] ACCESO NO AUTORIZADO EXITOSO desde {{event.device.mac}}"
          message: |
            ACCESO NO AUTORIZADO EXITOSO DETECTADO (CRÍTICO):
            Dispositivo: {{event.device.mac}}
            IP: {{event.device.ip}}
            Usuario: {{event.attempt.username}}
            Método: {{event.attempt.method}}
            Hora: {{event.timestamp}}
            Acción: Dispositivo puesto en cuarentena. INVESTIGACIÓN INMEDIATA REQUERIDA.
          severity: "critical"
      - type: "run_module"
        module: "incident_response"
        parameters:
          incident_type: "unauthorized_access"
          device_mac: "{{event.device.mac}}"
          response_level: "critical"
          timeout: 3600
    priority: "critical"
    enabled: true

# Reglas de respuesta a malware detectado
malware_detection_rules:
  - rule_id: "rule_malware_001"
    name: "Malware detectado - Cuarentena y análisis"
    description: "Poner en cuarentena el dispositivo y analizar el malware cuando sea detectado"
    condition: |
      event.type == "malware_detected" and
      event.malware.severity in ["medium", "high", "critical"]
    actions:
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Malware detectado: {{event.malware.type}}"
          severity: "{{event.malware.severity}}"
      - type: "run_module"
        module: "malware_analysis"
        parameters:
          device_mac: "{{event.device.mac}}"
          malware_type: "{{event.malware.type}}"
          analysis_type: "deep"
          timeout: 1800
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA] Malware detectado en {{event.device.mac}}"
          message: |
            Malware detectado:
            Tipo: {{event.malware.type}}
            Severidad: {{event.malware.severity}}
            Descripción: {{event.malware.description}}
            Dispositivo afectado: {{event.device.mac}}
            Acción: Dispositivo puesto en cuarentena. Análisis en curso.
          severity: "{{event.malware.severity}}"
    priority: "high"
    enabled: true

  - rule_id: "rule_malware_002"
    name: "Malware crítico detectado - Respuesta de emergencia"
    description: "Ejecutar respuesta de emergencia para malware crítico"
    condition: |
      event.type == "malware_detected" and
      event.malware.severity == "critical"
    actions:
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Malware crítico detectado: {{event.malware.type}}"
          severity: "critical"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com", "admin_network@aura-system.com"]
          subject: "[ALERTA CRÍTICA] MALWARE CRÍTICO DETECTADO en {{event.device.mac}}"
          message: |
            MALWARE CRÍTICO DETECTADO (EMERGENCIA):
            Tipo: {{event.malware.type}}
            Severidad: {{event.malware.severity}}
            Descripción: {{event.malware.description}}
            Dispositivo afectado: {{event.device.mac}}
            Acción: RESPUESTA DE EMERGENCIA INICIADA. TODO EL TRÁFICO DEL DISPOSITIVO DEBE SER MONITOREADO.
          severity: "critical"
      - type: "run_module"
        module: "emergency_response"
        parameters:
          incident_type: "critical_malware"
          device_mac: "{{event.device.mac}}"
          malware_type: "{{event.malware.type}}"
          response_level: "emergency"
          timeout: 3600
    priority: "critical"
    enabled: true

# Reglas de respuesta a dispositivos de alto riesgo
high_risk_device_rules:
  - rule_id: "rule_high_risk_001"
    name: "Dispositivo de alto riesgo detectado - Monitoreo intensivo"
    description: "Iniciar monitoreo intensivo para dispositivos de alto riesgo"
    condition: |
      event.type == "high_risk_device" and
      event.device.risk_score >= 70 and
      event.device.risk_score < 90
    actions:
      - type: "run_module"
        module: "intensive_monitoring"
        parameters:
          device_mac: "{{event.device.mac}}"
          monitoring_level: "high"
          duration: 86400  # 24 horas
          timeout: 86400
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "threat_intel@aura-system.com"]
          subject: "[ALERTA] Dispositivo de alto riesgo detectado: {{event.device.mac}}"
          message: |
            Dispositivo de alto riesgo detectado:
            MAC: {{event.device.mac}}
            IP: {{event.device.ip}}
            Puntuación de riesgo: {{event.device.risk_score}}
            Nivel de amenaza: {{event.device.threat_level}}
            Acción: Monitoreo intensivo iniciado (24 horas).
          severity: "high"
    priority: "high"
    enabled: true

  - rule_id: "rule_high_risk_002"
    name: "Dispositivo crítico detectado - Respuesta inmediata"
    description: "Ejecutar respuesta inmediata para dispositivos críticos"
    condition: |
      event.type == "high_risk_device" and
      event.device.risk_score >= 90
    actions:
      - type: "quarantine_device"
        module: "device_quarantine"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Dispositivo crítico detectado (riesgo: {{event.device.risk_score}})"
          severity: "critical"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA CRÍTICA] DISPOSITIVO CRÍTICO DETECTADO: {{event.device.mac}}"
          message: |
            DISPOSITIVO CRÍTICO DETECTADO (RIESGO EXTREMO):
            MAC: {{event.device.mac}}
            IP: {{event.device.ip}}
            Puntuación de riesgo: {{event.device.risk_score}}
            Nivel de amenaza: {{event.device.threat_level}}
            Acción: DISPOSITIVO PUESTO EN CUARENTENA. INVESTIGACIÓN INMEDIATA REQUERIDA.
          severity: "critical"
      - type: "run_module"
        module: "critical_device_response"
        parameters:
          device_mac: "{{event.device.mac}}"
          risk_score: "{{event.device.risk_score}}"
          response_level: "critical"
          timeout: 3600
    priority: "critical"
    enabled: true

# Reglas de respuesta a dispositivos no autorizados (rogue devices)
rogue_device_rules:
  - rule_id: "rule_rogue_001"
    name: "Dispositivo no autorizado detectado - Bloqueo inmediato"
    description: "Bloquear inmediatamente dispositivos no autorizados en la red"
    condition: |
      event.type == "rogue_device" and
      event.device.vendor == "Unknown"
    actions:
      - type: "block_network_access"
        module: "network_control"
        parameters:
          device_mac: "{{event.device.mac}}"
          reason: "Dispositivo no autorizado detectado"
          severity: "critical"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA CRÍTICA] DISPOSITIVO NO AUTORIZADO DETECTADO: {{event.device.mac}}"
          message: |
            DISPOSITIVO NO AUTORIZADO DETECTADO (CRÍTICO):
            MAC: {{event.device.mac}}
            IP: {{event.device.ip}}
            Vendor: {{event.device.vendor}} (desconocido)
            Ubicación: {{event.network.name}}
            Acción: ACCESO A LA RED BLOQUEADO. INVESTIGACIÓN INMEDIATA REQUERIDA.
          severity: "critical"
      - type: "run_module"
        module: "rogue_device_investigation"
        parameters:
          device_mac: "{{event.device.mac}}"
          investigation_type: "immediate"
          timeout: 3600
    priority: "critical"
    enabled: true

  - rule_id: "rule_rogue_002"
    name: "Dispositivo no autorizado con actividad sospechosa"
    description: "Analizar dispositivos no autorizados con actividad sospechosa"
    condition: |
      event.type == "rogue_device" and
      event.device.activity_score > 50
    actions:
      - type: "run_module"
        module: "suspicious_activity_analysis"
        parameters:
          device_mac: "{{event.device.mac}}"
          analysis_type: "rogue_device"
          timeout: 1800
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "threat_intel@aura-system.com"]
          subject: "[ALERTA] Actividad sospechosa en dispositivo no autorizado: {{event.device.mac}}"
          message: |
            Actividad sospechosa detectada en dispositivo no autorizado:
            MAC: {{event.device.mac}}
            IP: {{event.device.ip}}
            Puntuación de actividad sospechosa: {{event.device.activity_score}}
            Acción: Análisis en curso.
          severity: "high"
    priority: "high"
    enabled: true

# Reglas de respuesta a eventos personalizados
custom_event_rules:
  - rule_id: "rule_custom_001"
    name: "Evento personalizado - Ejecución de workflow"
    description: "Ejecutar un workflow personalizado cuando se detecta un evento personalizado"
    condition: |
      event.type == "custom_event" and
      event.custom_data.workflow == "security_audit"
    actions:
      - type: "trigger_workflow"
        module: "workflow_engine"
        parameters:
          workflow_name: "{{event.custom_data.workflow}}"
          workflow_parameters:
            target_device: "{{event.device.mac}}"
            audit_type: "{{event.custom_data.audit_type}}"
            timeout: "{{event.custom_data.timeout | default(3600)}}"
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Workflow personalizado iniciado: {{event.custom_data.workflow}} para dispositivo {{event.device.mac}}"
          device_mac: "{{event.device.mac}}"
          severity: "medium"
    priority: "medium"
    enabled: true

# Reglas de respuesta a escaneos completados
scan_completion_rules:
  - rule_id: "rule_scan_complete_001"
    name: "Escaneo de red completado - Análisis de resultados"
    description: "Analizar los resultados de un escaneo de red completado"
    condition: |
      event.type == "network_scan_complete" and
      event.scan.type == "full_network_scan"
    actions:
      - type: "run_module"
        module: "scan_analysis"
        parameters:
          scan_id: "{{event.scan.id}}"
          scan_type: "{{event.scan.type}}"
          network_name: "{{event.network.name}}"
          analysis_type: "full"
          timeout: 1800
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Análisis de escaneo completado para {{event.network.name}} (ID: {{event.scan.id}})"
          network_name: "{{event.network.name}}"
          severity: "medium"
    priority: "medium"
    enabled: true

  - rule_id: "rule_scan_complete_002"
    name: "Escaneo OSINT completado - Actualización de inteligencia"
    description: "Actualizar la inteligencia de amenazas con los resultados de un escaneo OSINT"
    condition: |
      event.type == "osint_scan_complete" and
      event.scan.targets.length > 0
    actions:
      - type: "update_threat_intel"
        module: "threat_intelligence"
        parameters:
          scan_id: "{{event.scan.id}}"
          scan_type: "{{event.scan.type}}"
          targets: "{{event.scan.targets}}"
          findings: "{{event.scan.findings}}"
          severity: "{{event.scan.severity}}"
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Actualización de inteligencia de amenazas con resultados de escaneo OSINT (ID: {{event.scan.id}})"
          scan_id: "{{event.scan.id}}"
          severity: "{{event.scan.severity}}"
    priority: "medium"
    enabled: true

# Reglas de respuesta a anomalías detectadas
anomaly_detection_rules:
  - rule_id: "rule_anomaly_001"
    name: "Anomalía detectada - Análisis adicional"
    description: "Realizar análisis adicional cuando se detecta una anomalía"
    condition: |
      event.type == "anomaly_detected" and
      event.anomaly.score > 60
    actions:
      - type: "run_module"
        module: "anomaly_analysis"
        parameters:
          anomaly_id: "{{event.anomaly.id}}"
          device_mac: "{{event.device.mac}}"
          anomaly_type: "{{event.anomaly.type}}"
          analysis_type: "deep"
          timeout: 1800
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Análisis adicional iniciado para anomalía detectada (ID: {{event.anomaly.id}})"
          anomaly_id: "{{event.anomaly.id}}"
          severity: "medium"
    priority: "medium"
    enabled: true

  - rule_id: "rule_anomaly_002"
    name: "Anomalía crítica detectada - Respuesta inmediata"
    description: "Ejecutar respuesta inmediata para anomalías críticas"
    condition: |
      event.type == "anomaly_detected" and
      event.anomaly.score >= 80
    actions:
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "incident_response@aura-system.com"]
          subject: "[ALERTA] Anomalía crítica detectada: {{event.anomaly.type}}"
          message: |
            Anomalía crítica detectada:
            Tipo: {{event.anomaly.type}}
            Puntuación: {{event.anomaly.score}}
            Dispositivo: {{event.device.mac}}
            Descripción: {{event.anomaly.description}}
            Acción: Análisis en curso. Posible amenaza.
          severity: "high"
      - type: "run_module"
        module: "critical_anomaly_response"
        parameters:
          anomaly_id: "{{event.anomaly.id}}"
          device_mac: "{{event.device.mac}}"
          response_level: "high"
          timeout: 3600
    priority: "high"
    enabled: true

# Reglas de respuesta a alertas del sistema
system_alert_rules:
  - rule_id: "rule_system_alert_001"
    name: "Alerta del sistema - Registro y notificación"
    description: "Registrar alertas del sistema y notificar al equipo de operaciones"
    condition: |
      event.type == "system_alert" and
      event.alert.severity in ["medium", "high", "critical"]
    actions:
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Alerta del sistema registrada: {{event.alert.message}}"
          alert_id: "{{event.alert.id}}"
          severity: "{{event.alert.severity}}"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["operations@aura-system.com"]
          subject: "[ALERTA DEL SISTEMA] {{event.alert.message}}"
          message: |
            Alerta del sistema:
            ID: {{event.alert.id}}
            Mensaje: {{event.alert.message}}
            Severidad: {{event.alert.severity}}
            Origen: {{event.alert.source}}
            Hora: {{event.timestamp}}
          severity: "{{event.alert.severity}}"
    priority: "medium"
    enabled: true

  - rule_id: "rule_system_alert_002"
    name: "Alerta crítica del sistema - Respuesta inmediata"
    description: "Ejecutar respuesta inmediata para alertas críticas del sistema"
    condition: |
      event.type == "system_alert" and
      event.alert.severity == "critical"
    actions:
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com", "admin_network@aura-system.com", "operations@aura-system.com"]
          subject: "[ALERTA CRÍTICA DEL SISTEMA] {{event.alert.message}}"
          message: |
            ALERTA CRÍTICA DEL SISTEMA:
            ID: {{event.alert.id}}
            Mensaje: {{event.alert.message}}
            Severidad: {{event.alert.severity}}
            Origen: {{event.alert.source}}
            Hora: {{event.timestamp}}
            Acción: RESPUESTA INMEDIATA REQUERIDA.
          severity: "critical"
      - type: "run_module"
        module: "system_response"
        parameters:
          alert_id: "{{event.alert.id}}"
          alert_type: "{{event.alert.type}}"
          response_level: "critical"
          timeout: 3600
    priority: "critical"
    enabled: true

# Reglas de validación y seguridad adicionales
additional_security_rules:
  - rule_id: "rule_security_003"
    name: "Validación de origen de eventos"
    description: "Validar que los eventos provengan de fuentes confiables"
    condition: |
      event.source not in ["network_sensor", "data_lakehouse", "swarm_manager", "gatekeeper"]
    actions:
      - type: "log_event"
        module: "security_audit"
        parameters:
          message: "Evento de origen no confiable detectado: {{event.source}}"
          event_id: "{{event.id}}"
          severity: "high"
      - type: "send_alert"
        module: "alert_notification"
        parameters:
          recipients: ["security@aura-system.com"]
          subject: "[ALERTA] Evento de origen no confiable detectado"
          message: |
            Evento de origen no confiable detectado:
            ID: {{event.id}}
            Tipo: {{event.type}}
            Origen: {{event.source}}
            Acción: Evento registrado pero no procesado.
          severity: "high"
    priority: "high"
    enabled: true

  - rule_id: "rule_security_004"
    name: "Detección de eventos duplicados"
    description: "Detectar y evitar procesamiento de eventos duplicados"
    condition: |
      event.duplicate == true
    actions:
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Evento duplicado detectado (ID: {{event.id}}). Evento ignorado."
          event_id: "{{event.id}}"
          severity: "low"
    priority: "low"
    enabled: true

# Reglas de limpieza y mantenimiento
maintenance_rules:
  - rule_id: "rule_maintenance_001"
    name: "Limpieza de reglas obsoletas"
    description: "Eliminar reglas que no se han ejecutado en más de 90 días"
    condition: |
      event.type == "maintenance_check" and
      event.check_type == "rule_cleanup"
    actions:
      - type: "run_module"
        module: "rule_maintenance"
        parameters:
          cleanup_type: "obsolete_rules"
          days_threshold: 90
          dry_run: false
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Limpieza de reglas obsoletas completada"
          severity: "medium"
    priority: "low"
    enabled: true

  - rule_id: "rule_maintenance_002"
    name: "Actualización de reglas"
    description: "Verificar y actualizar reglas cuando se detectan cambios en el sistema"
    condition: |
      event.type == "system_update" and
      event.update_type in ["new_module", "configuration_change", "policy_update"]
    actions:
      - type: "run_module"
        module: "rule_validation"
        parameters:
          validation_type: "full"
          update_type: "{{event.update_type}}"
          updated_module: "{{event.updated_module}}"
      - type: "log_event"
        module: "system_logging"
        parameters:
          message: "Validación de reglas completada después de actualización del sistema"
          update_type: "{{event.update_type}}"
          severity: "medium"
    priority: "medium"
    enabled: true

