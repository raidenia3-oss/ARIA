# Multi-node AURA cluster con Redis + Nginx LB

version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: aura_redis_cluster
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_cluster_data:/data
    networks:
      - aura_cluster_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend_1:
    build: .
    container_name: aura_backend_1
    environment:
      - PORT=8001
      - NODE_ID=node-1
      - CLUSTER_MODE=true
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - aura_cluster_network
    restart: unless-stopped

  backend_2:
    build: .
    container_name: aura_backend_2
    environment:
      - PORT=8002
      - NODE_ID=node-2
      - CLUSTER_MODE=true
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - aura_cluster_network
    restart: unless-stopped

  backend_3:
    build: .
    container_name: aura_backend_3
    environment:
      - PORT=8003
      - NODE_ID=node-3
      - CLUSTER_MODE=true
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - aura_cluster_network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: aura_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/aura.conf:/etc/nginx/conf.d/default.conf
      - nginx_cache:/var/cache/nginx/aura
    depends_on:
      - backend_1
      - backend_2
      - backend_3
    networks:
      - aura_cluster_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: aura_prometheus_cluster
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_cluster_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - aura_cluster_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aura_grafana_cluster
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_cluster_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aura_cluster_network
    restart: unless-stopped

volumes:
  redis_cluster_data:
  nginx_cache:
  prometheus_cluster_data:
  grafana_cluster_data:

networks:
  aura_cluster_network:
    driver: bridge
