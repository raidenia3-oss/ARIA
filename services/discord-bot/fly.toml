app = "aura-discord-bot"
primary_region = "iad"

[build]
  dockerfile = "services/discord-bot/Dockerfile"

[env]
  AURA_BACKEND_URL = "http://localhost:8000"
  REDIS_URL = "redis://localhost:6379/0"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 10
    soft_limit = 8
