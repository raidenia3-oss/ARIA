<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 15px;
    }
    .header h1 {
      color: #667eea;
      font-size: 20px;
    }
    .status {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 14px;
    }
    .status-value {
      font-weight: bold;
      color: #667eea;
    }
    .draft-list {
      background: white;
      padding: 15px;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
    }
    .draft-item {
      padding: 8px;
      margin: 5px 0;
      background: #f0f0f0;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .draft-item:hover {
      background: #e0e0e0;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    .settings-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .settings-row input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AURA Fanfic</h1>
    <p style="color: #999; font-size: 12px;">Generate Stories</p>
  </div>

  <div class="status">
    <div class="status-item">
      <span>Status</span>
      <span class="status-value" id="status">Loading...</span>
    </div>
    <div class="status-item">
      <span>Backend</span>
      <span class="status-value" id="backend-url">Loading...</span>
    </div>
    <div class="status-item">
      <span>Drafts Saved</span>
      <span class="status-value" id="saved">0</span>
    </div>
  </div>

  <div class="draft-list">
    <h3 style="margin-bottom: 10px;">Recent Drafts</h3>
    <div id="drafts">
      <p style="color: #999; font-size: 12px;">No drafts yet</p>
    </div>
  </div>

  <button id="open-settings">Settings</button>
  <button id="open-help">Help</button>

  <script src="popup.js"></script>
</body>
</html>
