<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA OS v1.0 — NÚCLEO FUNCIONAL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0e17;
  color: #38bdf8;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  padding: 15px;
}
.container { max-width: 1200px; margin: 0 auto; }
h1 {
  font-size: 22px;
  color: #38bdf8;
  text-shadow: 0 0 10px rgba(56,189,248,0.5);
  margin-bottom: 15px;
  letter-spacing: 2px;
}
.status-bar {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 15px;
  font-size: 12px;
}
.status-item { color: #10b981; }
.status-item.warn { color: #f59e0b; }
.chat-box {
  background: #111827;
  border: 1px solid #1e4d6b;
  border-radius: 4px;
  padding: 15px;
  margin-bottom: 15px;
  height: 380px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.5;
}
.message { margin: 8px 0; }
.message.user { color: #10b981; text-align: right; }
.message.aura { color: #38bdf8; }
.message.aura strong { color: #fbbf24; }
.tasks-panel {
  background: #111827;
  border: 1px solid #1e4d6b;
  border-radius: 4px;
  padding: 15px;
  margin-bottom: 15px;
}
.tasks-panel h2 { font-size: 14px; margin-bottom: 10px; color: #7dd3fc; }
.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
  font-size: 12px;
}
.task-name { width: 130px; color: #94a3b8; }
.progress-bar {
  flex: 1;
  height: 18px;
  background: #0a0e17;
  border: 1px solid #1e4d6b;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #38bdf8);
  transition: width 0.5s ease;
}
.progress-text { width: 70px; text-align: right; color: #64748b; }
.events-log {
  background: #111827;
  border: 1px solid #1e4d6b;
  border-radius: 4px;
  padding: 15px;
  margin-bottom: 15px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 11px;
}
.events-log h2 { font-size: 14px; margin-bottom: 8px; color: #7dd3fc; }
.event {
  padding: 3px 0;
  border-bottom: 1px solid #1e293b;
  color: #64748b;
}
.event .time { color: #475569; }
.event .type { color: #38bdf8; font-weight: bold; }
.input-area { display: flex; gap: 10px; }
input {
  flex: 1;
  background: #0a0e17;
  border: 1px solid #1e4d6b;
  color: #38bdf8;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  border-radius: 4px;
}
input:focus { outline: none; border-color: #38bdf8; }
button {
  background: #0a0e17;
  border: 1px solid #1e4d6b;
  color: #38bdf8;
  padding: 12px 20px;
  font-family: 'Courier New', monospace;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
}
button:hover { background: #1e4d6b; color: #fbbf24; }
</style>
</head>
<body>
<div class="container">
<h1>🤖 AURA OS v1.0 — NÚCLEO FUNCIONAL</h1>
<div class="status-bar">
  <span class="status-item" id="daemonStatus">● Daemon: offline</span>
  <span class="status-item" id="revenueStatus">● $0.00</span>
  <span class="status-item" id="ameStatus">● AME: offline</span>
  <span class="status-item" id="wsStatus">● WS: offline</span>
</div>

<div class="chat-box" id="chatBox">
  <div class="message aura">AURA: Inicializando núcleo... esperando daemon.</div>
</div>

<div class="tasks-panel">
  <h2>📊 Tareas en Ejecución</h2>
  <div id="tasksList"></div>
</div>

<div class="events-log">
  <h2>📡 Events (Live)</h2>
  <div id="eventsList"></div>
</div>

<div class="input-area">
  <input type="text" id="userInput" placeholder="Escribe un comando o pregunta para AURA..." autocomplete="off">
  <button id="sendBtn">Enivar</button>
</div>
</div>

<script>
const chatBox = document.getElementById('chatBox');
const tasksList = document.getElementById('tasksList');
const eventsList = document.getElementById('eventsList');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function addChatMessage(sender, text) {
  const div = document.createElement('div');
  div.className = 'message ' + sender;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addEvent(type, data) {
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'event';
  div.innerHTML = '<span class="time">[' + time + ']</span> <span class="type">' + type + '</span> ' + JSON.stringify(data).substring(0, 80);
  eventsList.prepend(div);
  while (eventsList.children.length > 30) eventsList.removeChild(eventsList.lastChild);
}

function renderTasks(tasks) {
  if (!tasks || tasks.length === 0) {
    tasksList.innerHTML = '<div style="color:#475569">Sin tareas activas</div>';
    return;
  }
  tasksList.innerHTML = tasks.map(t => {
    const statusIcon = t.status === 'complete' ? '✅' : t.status === 'in_progress' ? '🔄' : '⏳';
    return '<div class="task-item">' +
      '<span class="task-name">' + statusIcon + ' ' + t.name + '</span>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + (t.progress || 0) + '%"></div></div>' +
      '<span class="progress-text">' + (t.progress || 0) + '%' + (t.earned ? ' +$' + t.earned.toFixed(3) : '') + '</span>' +
    '</div>';
  }).join('');
}

async function fetchStatus() {
  try {
    const res = await fetch('/api/aura/status/full');
    const data = await res.json();
    document.getElementById('daemonStatus').textContent = '● Daemon: ' + (data.daemon?.daemon_active ? 'running' : 'stopped');
    document.getElementById('daemonStatus').className = 'status-item' + (data.daemon?.daemon_active ? '' : ' warn');
    document.getElementById('revenueStatus').textContent = '● $' + (data.revenue?.total || 0).toFixed(2);
    document.getElementById('ameStatus').textContent = '● AME: ' + (data.ame?.connected ? 'online' : 'offline');
    renderTasks(data.tasks);
  } catch(e) {}
}

async function sendMessage() {
  const msg = userInput.value.trim();
  if (!msg) return;
  userInput.value = '';
  addChatMessage('user', 'Tú: ' + msg);

  try {
    const res = await fetch('/api/aura/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg})
    });
    const data = await res.json();
    addChatMessage('aura', 'AURA: ' + (data.response || 'Sin respuesta'));
    if (data.tasks_running) renderTasks(data.tasks_running);
    if (data.revenue_today !== undefined) {
      document.getElementById('revenueStatus').textContent = '● $' + data.revenue_today.toFixed(2);
    }
  } catch(e) {
    addChatMessage('aura', 'AURA: Error de conexión');
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

let wsReconnectTimer = null;
function connectWS() {
  const ws = new WebSocket('ws://127.0.0.1:8000/ws/core/events');
  ws.onopen = () => {
    document.getElementById('wsStatus').textContent = '● WS: online';
    document.getElementById('wsStatus').className = 'status-item';
    if (wsReconnectTimer) { clearInterval(wsReconnectTimer); wsReconnectTimer = null; }
  };
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      addEvent(data.type || 'event', data.data || data);
    } catch(e) {}
  };
  ws.onclose = () => {
    document.getElementById('wsStatus').textContent = '● WS: reconnecting...';
    document.getElementById('wsStatus').className = 'status-item warn';
    wsReconnectTimer = setTimeout(connectWS, 3000);
  };
  ws.onerror = () => { ws.close(); };
}

setInterval(fetchStatus, 2000);
connectWS();
fetchStatus();
addChatMessage('aura', 'AURA: Sistema inicializado. Escribime un comando.');
</script>
</body>
</html>
