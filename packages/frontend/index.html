<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA OS - Immersive HUD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #hud-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            max-height: 80vh;
            overflow-y: auto;
        }
        #hud-content {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .hud-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div id="hud-overlay">
        <div id="hud-content"></div>
    </div>

    <script>
        // Conexión WebSocket con el backend
        const socket = new WebSocket("ws://localhost:8000/ws/hud/omni");

        // Función para actualizar el contenido del HUD
        function updateHUD(content) {
            const hudContent = document.getElementById("hud-content");
            hudContent.innerHTML = content;
        }

        // Manejar mensajes del WebSocket
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            updateHUD(data.content || "No content available");
        };

        // Enviar mensajes al backend (ejemplo: entrada de texto)
        function sendOmniInput(inputType, content) {
            const inputData = {
                input_type: inputType,
                content: content
            };
            fetch("http://localhost:8000/api/hud/omni/input", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(inputData),
            }).then(response => response.json())
                .then(data => console.log("Success:", data))
                .catch(error => console.error("Error:", error));
        }

        // Ejemplo de envío de entrada
        sendOmniInput("text", "Hola, AURA!");
    </script>
</body>
</html>
