name: AURA Continuous Training

on:
  push:
    paths:
      - 'training/data/interactions.jsonl'
      - 'training/scripts/**'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft datasets trl accelerate

      - name: Run orchestrator (skip synthetic)
        run: |
          python training/scripts/orchestrator.py --skip-synthetic --epochs 1 --max-samples 100

      - name: Upload LoRA adapter as artifact
        uses: actions/upload-artifact@v7
        with:
          name: aura-finetuned-lora
          path: fine-tuned-ame/aura_finetuned_lora/
          if-no-files-found: warn

      - name: Upload orchestrator report
        uses: actions/upload-artifact@v7
        with:
          name: orchestrator-report
          path: training/output/orchestrator_report.json
          if-no-files-found: warn