name: AURA tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Run Python unit tests
        run: |
          export PYTHONPATH=services/gesture-control:services/voice-commands
          pytest services/gesture-control/tests services/voice-commands/tests tests/unit/test_multilanguage_scaffolds.py -v
      - name: Run Python integration tests
        run: |
          export PYTHONPATH=services/gesture-control:services/voice-commands
          pytest tests/integration/test_backend_api.py -v

  ruby-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Ruby dependencies
        run: |
          bundle install --gemfile services/discord-bot/Gemfile
          bundle install --gemfile services/dsl-compiler/Gemfile
      - name: Run Ruby specs
        run: |
          bundle exec --gemfile services/discord-bot/Gemfile rspec services/discord-bot/spec
          bundle exec --gemfile services/dsl-compiler/Gemfile rspec services/dsl-compiler/spec
