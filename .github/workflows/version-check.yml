name: Version Check

# PR-0a: pyproject.toml is the single source of truth for the ARIA OS version.
# Everything else is a generated copy. This job fails the build if any copy
# drifts, which is what makes the auto-updater and the rolling-release channel
# able to trust the version they read at runtime.

on:
  push:
    branches: [main, feature/v6.0-axum-migration]
    tags: ['v*']
    paths:
      - 'pyproject.toml'
      - 'aria_version.py'
      - 'ARIA_APP/__init__.py'
      - 'VERSION'
      - 'setup.py'
      - 'config.yaml'
      - 'v5/package.json'
      - 'v6/axum-poc/Cargo.toml'
      - 'v6/axum-poc/src/version.rs'
      - 'aria-backend-axum/Cargo.toml'
      - 'v6/airi_mobile/pubspec.yaml'
      - 'tools/**'
      - '.github/workflows/version-check.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'aria_version.py'
      - 'ARIA_APP/__init__.py'
      - 'VERSION'
      - 'setup.py'
      - 'config.yaml'
      - 'v5/package.json'
      - 'v6/axum-poc/Cargo.toml'
      - 'v6/axum-poc/src/version.rs'
      - 'aria-backend-axum/Cargo.toml'
      - 'v6/airi_mobile/pubspec.yaml'
      - 'tools/**'
      - '.github/workflows/version-check.yml'
  workflow_dispatch:

jobs:
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show canonical version
        run: python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"

      # Read-only by design: CI must never be able to fix drift by writing to
      # the tree, or the gate would silently green-light a broken bump.
      - name: Verify every generated copy matches pyproject.toml
        run: python tools/verify_version.py --verbose

      - name: Unit tests for the version tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest tests/test_version_sync.py -v

  tag-matches-version:
    name: Tag matches canonical version
    runs-on: ubuntu-latest
    needs: verify-versions
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A tag that disagrees with the source of truth would make `git tag`
      # meaningless for the updater and for channel comparison.
      - name: Compare tag with pyproject.toml
        run: |
          CANONICAL=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG canonical=$CANONICAL"
          test "$TAG" = "$CANONICAL"
