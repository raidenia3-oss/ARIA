name: ARIA OS — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8 mypy pytest

    - name: Lint with black
      run: black --check AURA_APP tests

    - name: Lint with flake8
      run: flake8 AURA_APP tests

    - name: Type check with mypy
      run: mypy AURA_APP --ignore-missing-imports

    - name: Run tests
      run: pytest tests/ -v --tb=short

    - name: Generate verification report
      run: python tests/verify_all_systems.py || true

    - name: Upload verification report
      uses: actions/upload-artifact@v7
      with:
        name: verification-report
        path: verification_report.*

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ CI/CD checks passed!\n- Linting: OK\n- Tests: OK\n- Verification: OK\n\n[View Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          })
