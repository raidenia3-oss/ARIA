app = "aura-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  AURA_API_KEY = ""
  REDIS_URL = "redis://localhost:6379/0"
  AURA_LOCAL_MODEL_PATH = "/app/models/qwen-0.5b"
  AURA_CORS_ORIGINS = "*"

[[mounts]]
  source = "aura_models"
  destination = "/app/models"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[services]]
  internal_port = 8000
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
