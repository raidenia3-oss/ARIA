<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:400px; min-height:500px;
  background:#0f172a; color:#38bdf8;
  font-family:'Courier New',monospace;
  padding:0; overflow:hidden;
}
#header {
  background:#1e293b; padding:10px 14px;
  border-bottom:1px solid #38bdf8;
  display:flex; justify-content:space-between; align-items:center;
}
#header h2 { font-size:14px; color:#38bdf8; }
#header .status { font-size:10px; color:#22c55e; }
#chat {
  height:320px; overflow-y:auto; padding:10px;
  border-bottom:1px solid #334155;
}
.msg { margin:6px 0; padding:8px; border-radius:8px; font-size:12px; line-height:1.5; }
.msg-user { background:#1e3a5f; text-align:right; border-left:3px solid #38bdf8; }
.msg-aura { background:#0d2137; text-align:left; border-left:3px solid #22c55e; }
.msg-system { background:#2d1f1f; color:#f59e0b; font-style:italic; text-align:center; font-size:11px; }
#input-area { display:flex; padding:10px; gap:6px; background:#1e293b; }
#input { flex:1; background:#0f172a; color:#38bdf8; border:1px solid #334155; padding:8px; border-radius:6px; font-family:inherit; font-size:12px; }
#input:focus { outline:none; border-color:#38bdf8; }
button { background:#38bdf8; color:#0f172a; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:700; font-size:12px; }
button:hover { background:#0ea5e9; }
#shortcuts { display:flex; gap:4px; padding:6px 10px; background:#1e293b; flex-wrap:wrap; }
.sc { background:#334155; color:#94a3b8; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer; }
.sc:hover { background:#38bdf8; color:#0f172a; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#0f172a; }
::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
</style>
</head>
<body>
<div id="header">
  <h2>AURA Assistant</h2>
  <span class="status">online</span>
</div>
<div id="chat">
  <div class="msg msg-system">AURA v1.2 connected</div>
</div>
<div id="shortcuts">
  <button class="sc" onclick="cmdFanfic()">/fanfic</button>
  <button class="sc" onclick="cmdSearch()">/search</button>
  <button class="sc" onclick="cmdMarketplace()">/marketplace</button>
  <button class="sc" onclick="cmdNetrunner()">/netrunner</button>
  <button class="sc" onclick="cmdStatus()">/status</button>
</div>
<div id="input-area">
  <input type="text" id="input" placeholder="Chat con AURA... (/help)" onkeydown="if(event.key==='Enter')sendMessage()" autocomplete="off">
  <button onclick="sendMessage()">Enviar</button>
</div>
<script src="popup.js"></script>
</body>
</html>
