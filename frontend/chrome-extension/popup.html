<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 12px; font-family: 'Courier New', monospace; background: #0a0c10; color: #e6e9f0; width: 320px; }
    h1 { font-size: 12px; margin: 0 0 8px; color: #7c4dff; }
    .status { font-size: 11px; padding: 4px 8px; border-radius: 4px; margin-bottom: 8px; }
    .connected { background: rgba(0,200,83,0.15); color: #00C853; }
    .disconnected { background: rgba(255,215,0,0.15); color: #FFD700; }
    .error { background: rgba(220,20,60,0.15); color: #DC143C; }
    button { width: 100%; padding: 6px; margin: 4px 0; font-size: 11px; border: 1px solid rgba(124,77,255,0.4); border-radius: 4px; background: rgba(124,77,255,0.1); color: #e6e9f0; cursor: pointer; }
    button:hover { background: rgba(124,77,255,0.2); }
    .section { margin: 8px 0; padding-top: 8px; border-top: 1px solid rgba(124,77,255,0.1); font-size: 10px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>AURA OS — Control del Navegador</h1>
  <div id="status" class="status disconnected">Desconectado</div>
  <div id="currentAction" style="font-size:10px; margin-bottom:6px; opacity:0.6;"></div>
  <button id="toggle">Activar AURA</button>
  <button id="stop">Detener tarea activa</button>
  <button id="sites">Gestionar sitios permitidos</button>
  <div class="section">No se extraen cookies, tokens ni contraseñas. La extensión solo interactúa con contenido visible en pestañas autorizadas.</div>
  <script src="popup.js"></script>
</body>
</html>
