# AURA OS - Hyprland Configuration
# Theme: Caelestia (purple/blue gradient + glass effects)

monitor=,preferred,auto,1

# ============================================
# INPUT
# ============================================
input {
    kb_layout = us,es
    kb_variant = ,
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    float_switch_override_focus = 2
    touchpad {
        natural_scroll = false
        tap_to_click = true
        disable_while_typing = true
    }
}

# ============================================
# GENERAL
# ============================================
general {
    gaps_in = 8
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(8a2be2ff) rgba(38bdf8ff) 45deg
    col.inactive_border = rgba(0a0e27ff)
    col.n_border = rgba(0a0e27ff)
    layout = master
    allow_tearing = false
    resize_on_border = true
}

# ============================================
# DECORATION
# ============================================
decoration {
    rounding = 12
    drop_shadow = yes
    shadow_range = 8
    shadow_render_power = 4
    col.shadow = rgba(1a1a2eff)
    
    blur {
        enabled = yes
        size = 10
        passes = 4
        ignore_opacity = true
        xray = false
    }
    
    vignette {
        enabled = true
        size = 0.5
    }
}

# ============================================
# ANIMATIONS
# ============================================
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.36, 0, 0.66, -0.56
    
    animation = windows, 1, 7, myBezier, slide
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderLength, 1, 10, default
    animation = fade, 1, 7, default
    animation = fadeDim, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = workspacesIn, 1, 6, smoothOut, slide
    animation = workspacesOut, 1, 6, smoothIn, slide
    animation = borderNodeFocus, 1, 10, default
    animation = floating, 1, 7, myBezier
    animation = minimize, 1, 7, myBezier
    animation = mouseMove, 1, 10, default
    animation = layout, 1, 7, default
}

# ============================================
# DWINDLE
# ============================================
dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = true
    smart_resizing = true
}

# ============================================
# MASTER
# ============================================
master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}

# ============================================
# MISC
# ============================================
misc {
    force_default_wallpaper = 0
    enable_swallow = true
    swallow_regex = ^(kitty|alacritty|foot)$
    hide_edge_windows = true
    allow_tearing = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# ============================================
# KEYBINDS
# ============================================
$mainMod = SUPER
$alt = ALT
$ctrl = CTRL

# Applications
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, Q, killactive,
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, E, exec, pcmanfm
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen

# AURA
bind = $mainMod, A, exec, /opt/aura/scripts/aura-cli.sh
bind = $mainMod, O, exec, /opt/aura/scripts/aura-voice.sh
bind = $mainMod, G, exec, ruby /opt/aura/scripts/custom_tools.rb
bind = $mainMod, W, exec, /opt/aura/scripts/panel.sh

# Window management
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scratchpad
bind = $mainMod, X, togglescratch, terminal
bind = $mainMod, C, togglescratch, browser

# Media
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy

# Lock
bind = $mainMod, L, exec, hyprlock

# ============================================
# SCRATCHPAD
# ============================================
scratchpad {
    terminal {
        command = alacritty
        class = alacritty
        size = 50%
        position = 0 0
    }
    browser {
        command = firefox
        class = firefox
        size = 50%
        position = 0 0
    }
}

# ============================================
# AUTOSTART
# ============================================
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = /opt/aura/scripts/panel.sh
exec-once = /opt/aura/scripts/aura-personalizada.sh

# Wallpaper con hyprpaper
exec-once = hyprpaper -f /usr/share/pixmaps/aura-wallpaper.png

# ============================================
# WINDOW RULES
# ============================================
windowrule = float, ^(pavucontrol|nm-connection-editor|file-roller)$
windowrule = size 800x600, ^(pavucontrol|nm-connection-editor)$
windowrule = move 0.5 0.5, ^(pavucontrol|nm-connection-editor)$

windowrule = workspace 2, Firefox
windowrule = workspace 3, Code
windowrule = workspace 4, Discord

windowrule = pin, ^(firefox|chromium)$

# ============================================
# LAYOUT
# ============================================
master {
    new_status = master
    new_on_top = true
    mfact = 0.55
}
