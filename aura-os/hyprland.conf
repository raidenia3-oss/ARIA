# AURA OS — Hyprland Configuration

# AURA OS v2.1 — Hyprland Configuration

monitor=,highres,auto,1

# Environment
env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Autostart
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = /opt/aura/backend/run.sh

# Input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    
    follow_mouse = 1
    mouse_refocus = false
    float_switch_override_focus = 2
}

# General
general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(88ff00ff)
    col.inactive_border = rgba(2a2a2aff)
    layout = dwindle
    resize_on_border = true
}

# Decoration
decoration {
    rounding = 12
    blur = true
    blur_size = 5
    blur_passes = 3
    blur_new_optimizations = true
    
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(00000099)
    
    blurls = lockscreen
}

# Animations
animations {
    enabled = true
    
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = windowsMove, 1, 7, default
    animation = windowsIn, 1, 7, default, popin 80%
    animation = fadeIn, 1, 7, default
    animation = fadeOut, 1, 7, default
    animation = fade, 1, 7, default
    animation = layers, 1, 7, default
}

# Workspace
workspace = 1, monitor:HDMI-1, default:true
workspace = 2, monitor:HDMI-1
workspace = 3, monitor:HDMI-1
workspace = 4, monitor:HDMI-1
workspace = 5, monitor:HDMI-1

# Window rules
windowrule = float, ^(Alacritty)$
windowrule = size 1200 800, ^(Alacritty)$
windowrule = center, ^(Alacritty)$

windowrule = float, title:^(AURA Dashboard)$
windowrule = size 1920 1080, title:^(AURA Dashboard)$

# Keybindings
$mod = SUPER
$alt = ALT

# Launch
bind = $mod, Return, exec, alacritty
bind = $mod, D, exec, rofi -show drun
bind = $mod, P, exec, hyprpicker | wl-copy

# Window management
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, E, layoutmsg, togglesplit

# Workspace movement
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Focus navigation
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Resize
bind = $mod SHIFT, left, resizeactive, -50 0
bind = $mod SHIFT, right, resizeactive, 50 0
bind = $mod SHIFT, up, resizeactive, 0 -50
bind = $mod SHIFT, down, resizeactive, 0 50

# System
bind = $mod SHIFT, E, exec, logout
bind = $mod, L, exec, hyprlock
bind = $mod, M, exec, aura-scanner -h localhost -p 1 -e 1000

# AURA specific
bind = $mod, A, exec, alacritty -e bash -c 'curl http://localhost:8000/api/chat && bash'
bind = $mod, C, exec, alacritty -e aura-c2-client -cmd list-agents
bind = $mod, P, exec, alacritty -e aura-pentest help
