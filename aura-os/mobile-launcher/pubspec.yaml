name: aura_mobile_launcher
description: AURA Mobile Launcher - Asistente virtual sincronizado con PC
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  provider: ^6.1.0
  flutter_local_notifications: ^17.0.0
  mdns_plugin: ^2.0.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  flutter_webrtc: ^0.11.0
  permission_handler: ^11.3.0
  battery_plus: ^2.1.0
  connectivity_plus: ^5.0.0
  workmanager: ^0.5.0
  flutter_foreground_task: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
