[package]
name = "aria-axum-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["json", "tokio", "http1", "ws"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[profile.release]
opt-level = 3
lto = true