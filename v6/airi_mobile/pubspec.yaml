name: airi_mobile
description: ARIA v6.0 mobile sync client (Phase Airi) — talks to the Axum backend on :8002.
publish_to: "none"
version: 6.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # HTTP + JSON for the Axum REST surface.
  dio: ^5.4.3+1

  # RFC 6455 WebSocket for /ws. Replaces the abandoned `websocket_client`
  # package (see v6/MOBILE_SYNC_SPEC.md §8).
  web_socket_channel: ^2.4.5

  # Local persistence for settings, the offline command queue and caches.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Local notification rendering + FCM data-message receiver.
  flutter_local_notifications: ^17.1.0
  firebase_core: ^2.27.0
  firebase_messaging: ^15.0.4

  uuid: ^4.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
